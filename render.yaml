# Render Blueprint for NityaMed (FastAPI Backend + Expo Static Web Site)
# Connect your GitHub repository to Render and set the `sync: false` secrets in the Render Dashboard.

services:
  - type: web
    name: nityamed-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && alembic upgrade head && python -m app.modules.medicines.seed
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.9"
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false # Paste Neon / Supabase postgresql+psycopg://... URL with ?sslmode=require
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://nityamed-web.onrender.com,http://localhost:8081,http://localhost:8082
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "false"
      - key: EMAIL_WEBHOOK_URL
        sync: false # Optional Google Apps Script HTTPS Gmail relay URL
      - key: EMAIL_WEBHOOK_SECRET
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false

  - type: web
    name: nityamed-web
    runtime: static
    rootDir: mobile
    buildCommand: npm install && npx expo export --platform web
    staticPublishPath: dist
    envVars:
      - key: EXPO_PUBLIC_API_URL
        value: https://nityamed-api.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
